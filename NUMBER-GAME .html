<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">

    <title>بازی حدس اعداد</title>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: black;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .gameb {
            background-color: #8d99ae;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            width: 300px;
        }
        h2 {
            margin-top: 0;
            color: #404040
        }
        input {
            padding: 10px;
            font-size: 18px;
            width: 80px;
            text-align: center;
            border: 2px solid blue;
            border-radius: 8px;
            margin-bottom: 15px;
            outline: none;
        }
        button {
            padding: 10px 15px;
            font-size: 16px;
            font-weight: bold;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
            transition: 0.2s;
        
        }
        button:hover {
            background-color: #0000cc;
            transform: scale(1.05);
        }
        p {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #404040;
            min-height: 25px;
        }
    </style>
</head>
<body>

    <div class="gameb">
    <h2>عدد بین 1 تا 100 را حدس بزن</h2>
    
    <input type="number" id="THENUMBER">
    <button onclick="check()">حدس بزن</button>
    <button onclick="newg()">شروع دوباره</button>
    <p id="RESULT">نتیجه حدس شما</p>

    </div>

    <script>
        let random;
        function start() {
            random = Math.floor(Math.random() * 100) +  1;
        }
        start();

        function newg() {
            document.getElementById("THENUMBER").value = "";
            start();
        }
        
        function check() {

            let user = document.getElementById("THENUMBER").value;
            let text = document.getElementById("RESULT");

            if (user == random) {
                text.innerHTML = "افرین درسته";
            } else if (user > random) {
                text.innerHTML = "پایینتر";
            } else {
                text.innerHTML = "بالاتر";
            }
        }
    </script>
</body>
</html>
